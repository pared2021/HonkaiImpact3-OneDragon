[project]
name = "HonkaiImpact3-OneDragon"
version = "1.0.0"
description = "崩坏三 一条龙 | 全自动日常 | 自动战斗 | 支持手柄"
requires-python = ">=3.11.9,<=3.11.12"
dependencies = [
    "pyside6==6.8.0.2",
    "pyside6-fluent-widgets==1.11.1",
    "pyyaml==6.0.1",
    "opencv-python==4.10.0.84",
    "pyautogui==0.9.54",
    "pynput==1.7.7",
    "onnxruntime-directml==1.18.0",
    "mss==9.0.1",
    "shapely==2.0.4",
    "pyclipper==1.3.0.post5",
    "soundcard==0.4.3",
    "librosa==0.10.2.post1",
    "gensim==4.3.3",
    "pygit2==1.19.0",
]

[dependency-groups]
dev = [
    "colorama==0.4.6",
    "polib==1.2.0",
    "pyinstaller==6.7.0",
    "pyuac==0.0.3",
]

[tool.uv]
package = false
cache-dir = "./.install/uv_cache"
environments = ["sys_platform == 'win32'"]
default-groups = []


[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
    "SIM",
    "TID",
]
ignore = ["RUF001", "RUF003"]
extend-ignore = [
    "E501",
    "C901",
    "SIM102",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
